<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rental Mobil Malang | Tambah Penyewa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header class="navbar navbar-expand-lg navbar-dark" style="background-color:#13273f;">
        <div class="container">
            <a class="navbar-brand" href="../index.html"><i class="bi bi-car-front-fill me-2"></i>Rental Mobil Malang</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="../mobil/list.html">Daftar Mobil</a></li>
                    <li class="nav-item"><a class="nav-link" href="../mobil/tambah.html">Tambah Mobil</a></li>
                    <li class="nav-item"><a class="nav-link" href="list.html">Daftar Penyewa</a></li>
                    <li class="nav-item"><a class="nav-link active" href="tambah.html">Tambah Penyewa</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-4">
        <section class="page-header mb-4">
            <div class="d-flex align-items-center gap-3 mb-2">
                <span class="page-header-icon"><i class="bi bi-person-plus-fill"></i></span>
                <h2>Tambah Penyewa</h2>
            </div>
            <p class="mb-0">Daftarkan penyewa baru untuk Rental Mobil Malang.</p>
        </section>

        <section class="card shadow-sm mb-4">
            <div class="card-body">
                <form id="form-penyewa" novalidate>
                    <div class="mb-3">
                        <label for="nama" class="form-label fw-semibold">Nama</label>
                        <input type="text" class="form-control" id="nama" name="nama">
                    </div>
                    <div class="mb-3">
                        <label for="no_hp" class="form-label fw-semibold">No. HP</label>
                        <input type="text" class="form-control" id="no_hp" name="no_hp" placeholder="08123456789">
                    </div>
                    <div class="mb-3">
                        <label for="alamat" class="form-label fw-semibold">Alamat</label>
                        <input type="text" class="form-control" id="alamat" name="alamat">
                    </div>
                    <button type="submit" class="btn btn-brand">Simpan</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="text-center py-3 small">
        <p class="mb-0">&copy; 2026 Rental Mobil Malang &mdash; Jobsheet 6</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
</body>
</html>
