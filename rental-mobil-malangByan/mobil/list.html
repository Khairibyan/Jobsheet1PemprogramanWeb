<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rental Mobil Malang | Daftar Mobil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header class="navbar navbar-expand-lg navbar-dark" style="background-color:#13273f;">
        <div class="container">
            <a class="navbar-brand" href="../index.html"><i class="bi bi-car-front-fill me-2"></i>Rental Mobil Malang</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link active" href="list.html">Daftar Mobil</a></li>
                    <li class="nav-item"><a class="nav-link" href="tambah.html">Tambah Mobil</a></li>
                    <li class="nav-item"><a class="nav-link" href="../penyewa/list.html">Daftar Penyewa</a></li>
                    <li class="nav-item"><a class="nav-link" href="../penyewa/tambah.html">Tambah Penyewa</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-4">
        <section class="page-header mb-4">
            <div class="d-flex align-items-center gap-3 mb-2">
                <span class="page-header-icon"><i class="bi bi-car-front-fill"></i></span>
                <h2>Daftar Mobil</h2>
            </div>
            <p class="mb-0">Kelola armada mobil Rental Mobil Malang.</p>
        </section>

        <section class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="d-flex flex-wrap justify-content-end align-items-center gap-2 mb-3">
                    <input type="text" id="filter-mobil" class="form-control search-box" placeholder="Cari kode / merek mobil...">
                </div>
                <div id="loading-indicator">
                    <div class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></div>
                    <span>Memuat data mobil...</span>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle" id="tabel-mobil">
                        <thead>
                            <tr>
                                <th>Kode Mobil</th>
                                <th>Merek &amp; Model</th>
                                <th>Kapasitas</th>
                                <th>Harga/Hari</th>
                                <th>Status</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <footer class="text-center py-3 small">
        <p class="mb-0">&copy; 2026 Rental Mobil Malang &mdash; Jobsheet 6</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/mobil.js"></script>
