<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RentalPS-Mini | Daftar Unit PS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header class="navbar navbar-expand-lg navbar-dark" style="background-color:#17122b;">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="../index.html">🎮 RentalPS-Mini</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <nav class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link active" href="list.html">Daftar Unit PS</a></li>
                    <li class="nav-item"><a class="nav-link" href="tambah.html">Tambah Unit PS</a></li>
                    <li class="nav-item"><a class="nav-link" href="../penyewa/list.html">Daftar Penyewa</a></li>
                    <li class="nav-item"><a class="nav-link" href="../penyewa/tambah.html">Tambah Penyewa</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container my-4">
        <section class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
                    <h2 class="card-title mb-0 h4">Daftar Unit PS</h2>
                    <input type="text" id="filter-unit-ps" class="form-control search-box" placeholder="Cari kode unit / jenis konsol...">
                </div>
                <div id="loading-indicator">
                    <div class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></div>
                    <span>Memuat data unit PS...</span>
                </div>
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle" id="tabel-unit-ps">
                        <thead style="background-color:#17122b;">
                            <tr class="text-white">
                                <th>Kode Unit</th>
                                <th>Jenis Konsol</th>
                                <th>Jumlah Stik</th>
                                <th>Harga/Jam</th>
                                <th>Status</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Baris diisi otomatis oleh assets/js/unit-ps.js lewat fetch data/unit-ps.json -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <footer class="text-center text-secondary py-3 small">
        <p class="mb-0">&copy; 2026 RentalPS-Mini &mdash; Jobsheet 6 (Fetch API &amp; JSON)</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/unit-ps.js"></script>
</body>
</html>
